<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMelt Studio — Melt Optimisation</title>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
    <link rel="stylesheet" href="css/smartmelt.css">
</head>
<body>
    <header class="header">
        <div class="header-title">🔥 SmartMelt Studio</div>
        <div class="header-meta" id="engine-version">engine v... · advisory-only</div>
        <div class="header-meta" style="margin-left:auto;">Plant:</div>
        <select id="plant-select"></select>
        <div id="header-status">status</div>
    </header>
    
    <nav id="tab-bar">
        <button data-tab="operator" class="active">Operator Console</button>
        <button data-tab="trajectory">Process Trajectory</button>
        <button data-tab="physics">Physics & Energy</button>
        <button data-tab="ekf">Virtual Sensor</button>
        <button data-tab="ml">Machine Learning</button>
        <button data-tab="drift">Drift Monitor</button>
        <button data-tab="chargemix">Charge-Mix</button>
        <button data-tab="economics">Economics</button>
        <button data-tab="heatlog">Heat Log</button>
        <button data-tab="settings">Settings</button>
        <button data-tab="validation">Validation</button>
        <button data-tab="about">About / Details</button>
    </nav>
    
    <main id="tab-content">
        <section data-tab="operator" id="tab-operator" class="tab-panel" style="display:block;">
          <!-- 3-column operator layout matching the reference image -->
          <div class="op-layout">

            <!-- LEFT: KPI strip -->
            <div class="op-left">
              <div class="heat-clock-sm" id="op-clock">00:00</div>
              <div id="op-status-pill" style="margin-bottom:6px;"></div>
              <div id="op-kpi" class="op-kpi-list"></div>
              <!-- Advisory -->
              <div class="section-title-sm" style="margin-top:10px;">ADVISORY — LIVE VERDICTS</div>
              <div class="adv-grid" id="op-adv"></div>
              <!-- Mini trend chart -->
              <div style="margin-top:8px;background:#0d1318;border:1px solid #1c2830;border-radius:4px;padding:4px;">
                <div class="thin-note" style="margin-bottom:2px;">LIVE TREND — TEMPERATURE &amp; MELT</div>
                <div id="op-trend"></div>
              </div>
              <div class="thin-note" id="op-end-text" style="margin-top:6px; white-space:pre-wrap;"></div>
            </div>

            <!-- CENTER: 3D furnace (large, fills the space) -->
            <div class="op-center">
              <div class="furnace-frame-big" style="position:relative;">
                <canvas id="furnace-canvas"></canvas>
                <div id="furnace-temp" style="
                  position:absolute; top:14px; left:50%; transform:translateX(-50%);
                  font-size:26px; font-weight:900; color:#ffd166; letter-spacing:2px;
                  text-shadow: 0 0 18px #ff7020, 0 0 36px #ff4000;
                  font-family:'Consolas','Courier New',monospace;
                ">— °C</div>
              </div>
            </div>

            <!-- RIGHT: Controls sidebar -->
            <div class="op-right">
              <div class="ctrl-panel">
                <div class="ctrl-section-hdr">▾ SmartMelt controls</div>
                <div class="ctrl-section-hdr-2">▾ Heat setup</div>
                <div class="ctrl-row"><label>Charge (t)</label>
                  <input type="range" id="op-charge" min="4" max="14" step="0.1" value="12">
                  <span class="ctrl-val" id="op-charge-val">12</span>
                </div>
                <div class="ctrl-row"><label>Power (kW)</label>
                  <input type="range" id="op-power" min="1000" max="8000" step="100" value="5300">
                  <span class="ctrl-val" id="op-power-val">5300</span>
                </div>
                <div class="ctrl-row"><label>Charge C (%)</label>
                  <input type="range" id="op-c" min="0.05" max="1.5" step="0.01" value="0.30">
                  <span class="ctrl-val" id="op-c-val">0.30</span>
                </div>
                <div class="ctrl-row"><label>Charge Cu (%)</label>
                  <input type="range" id="op-cu" min="0.05" max="0.5" step="0.01" value="0.20">
                  <span class="ctrl-val" id="op-cu-val">0.20</span>
                </div>
                <div class="ctrl-row"><label>Tap aim (°C)</label>
                  <span class="ctrl-val" style="flex:1;text-align:right;">1620</span>
                </div>

                <div class="ctrl-section-hdr-2" style="margin-top:10px;">▾ Operation</div>
                <div style="display:flex;gap:6px;margin-bottom:6px;">
                  <button class="btn btn-primary" id="btn-start" style="flex:1;">▶ Start heat</button>
                  <button class="btn" id="btn-tap" style="flex:1;" disabled>⏏ tap heat</button>
                </div>
                <div style="margin-bottom:6px;">
                  <div class="thin-note" style="margin-bottom:4px;">Playback speed</div>
                  <div style="display:flex;gap:4px;">
                    <button class="btn speed-btn" data-speed="0" style="flex:1;font-size:10px;">⏸</button>
                    <button class="btn speed-btn" data-speed="1" style="flex:1;font-size:10px;">1×</button>
                    <button class="btn speed-btn active" data-speed="10" style="flex:1;font-size:10px;">10×</button>
                    <button class="btn speed-btn" data-speed="60" style="flex:1;font-size:10px;">100× real-time</button>
                  </div>
                </div>

                <div class="ctrl-section-hdr-2">▾ Add material (during heat)</div>
                <div class="ctrl-row" style="gap:4px;">
                  <label>Material</label>
                  <select id="op-material" style="flex:2;background:#111820;color:#cfd6dd;border:1px solid #20262c;border-radius:3px;padding:2px 4px;"></select>
                </div>
                <div class="ctrl-row" style="gap:4px;">
                  <label>Mass (kg)</label>
                  <input type="number" id="op-mass" min="0" step="1" value="48" style="flex:1;background:#111820;color:#cfd6dd;border:1px solid #20262c;border-radius:3px;padding:2px 6px;">
                </div>
                <button class="btn" id="btn-add" style="width:100%;margin-top:4px;" disabled>+ Add to bath now</button>
                <div style="display:flex;gap:3px;margin-top:5px;flex-wrap:wrap;">
                  <button class="btn quick-add" data-mat="Lime (92% CaO)" data-mass="48" style="flex:1;font-size:10px;padding:3px;">Lime</button>
                  <button class="btn quick-add" data-mat="FeSi75" data-mass="15" style="flex:1;font-size:10px;padding:3px;">FeSi75</button>
                  <button class="btn quick-add" data-mat="Carburiser" data-mass="12" style="flex:1;font-size:10px;padding:3px;">Carburiser</button>
                  <button class="btn quick-add" data-mat="Mill scale (FeO)" data-mass="120" style="flex:1;font-size:10px;padding:3px;">Mill scale</button>
                </div>

                <div class="ctrl-section-hdr-2" style="margin-top:10px;">▾ View</div>
                <div class="logbox" id="op-log" style="margin-top:4px;">&nbsp;</div>
              </div>
            </div>

          </div>
        </section>
        
        <section data-tab="trajectory" id="tab-trajectory" class="tab-panel"></section>
        <section data-tab="physics" id="tab-physics" class="tab-panel"></section>
        <section data-tab="ekf" id="tab-ekf" class="tab-panel"></section>
        <section data-tab="ml" id="tab-ml" class="tab-panel"></section>
        <section data-tab="drift" id="tab-drift" class="tab-panel"></section>
        <section data-tab="chargemix" id="tab-chargemix" class="tab-panel"></section>
        <section data-tab="economics" id="tab-economics" class="tab-panel"></section>
        <section data-tab="heatlog" id="tab-heatlog" class="tab-panel"></section>
        <section data-tab="settings" id="tab-settings" class="tab-panel"></section>
        <section data-tab="validation" id="tab-validation" class="tab-panel"></section>
        <section data-tab="about" id="tab-about" class="tab-panel"></section>
    </main>
    
    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
